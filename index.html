<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05080f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e2338'/%3E%3Cpath d='M43 11a21 21 0 1 0 10 33A17 17 0 0 1 43 11Z' fill='%23ffe3a1'/%3E%3Ccircle cx='49' cy='17' r='3' fill='%2367e6c3'/%3E%3C/svg%3E" />
    <title>星夜マート — 雨の街角</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05080f;
      }
      body {
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
      }
      body.dragging {
        cursor: grabbing;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #veil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 52% 46%, rgba(52, 82, 128, 0.2), transparent 54%),
          radial-gradient(ellipse at 50% 50%, #0a1120 0%, #04060b 75%);
        opacity: 1;
        transition: opacity 1.4s ease;
        z-index: 2;
      }
      #veil.hidden {
        opacity: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="雨夜のコンビニ街角ジオラマ"></canvas>
    <div id="veil"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
